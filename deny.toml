# cargo deny check — supply-chain policy for FaceTilt.
# Privacy rule: no crate capable of networking, telemetry or crash reporting may enter the tree.

[graph]
targets = [
    { triple = "aarch64-linux-android" },
    { triple = "armv7-linux-androideabi" },
    { triple = "x86_64-unknown-linux-gnu" },
]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Internal path dependencies of this (unpublished) workspace are fine.
allow-wildcard-paths = true
deny = [
    # HTTP / networking stacks
    { name = "reqwest" }, { name = "hyper" }, { name = "hyper-util" }, { name = "h2" }, { name = "h3" },
    { name = "ureq" }, { name = "curl" }, { name = "curl-sys" }, { name = "isahc" }, { name = "surf" },
    { name = "attohttpc" }, { name = "minreq" }, { name = "tungstenite" }, { name = "tokio-tungstenite" },
    { name = "quinn" }, { name = "socket2" }, { name = "mio" }, { name = "tokio" }, { name = "async-std" },
    { name = "smol" }, { name = "trust-dns-resolver" }, { name = "hickory-resolver" },
    # TLS (only needed to talk to a network)
    { name = "rustls" }, { name = "native-tls" }, { name = "openssl" }, { name = "openssl-sys" }, { name = "ring" },
    # Telemetry / crash reporting / analytics
    { name = "sentry" }, { name = "sentry-core" }, { name = "opentelemetry" }, { name = "bugsnag" },
    { name = "crashreport" }, { name = "minidump-writer" }, { name = "breakpad-sys" }, { name = "datadog-apm" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
