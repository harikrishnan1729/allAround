org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Rust build options (see README "Building"):
#   facetilt.abis           comma-separated ABIs passed to cargo-ndk
#   facetilt.rustProfile    release | debug
facetilt.abis=arm64-v8a,armeabi-v7a
facetilt.rustProfile=release
